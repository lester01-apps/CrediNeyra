<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña | crediNeyra</title><link rel="stylesheet" th:href="@{/css/auth-recuperacion.css}"></head>
<body class="auth-recovery"><main class="recovery-card"><p class="recovery-brand">credi<span>Neyra</span></p><p class="recovery-eyebrow">RECUPERACIÓN SEGURA</p><h1>Recupera tu contraseña</h1><p class="recovery-description">Ingresa el correo registrado en tu cuenta. Te enviaremos un código temporal para definir una nueva contraseña.</p><p class="recovery-message success" th:if="${mensaje != null}" th:text="${mensaje}"></p><p class="recovery-message error" th:if="${mensajeError != null}" th:text="${mensajeError}"></p><form class="recovery-form" method="post" th:action="@{/recuperar-password}" th:object="${solicitudDto}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="email">Correo electrónico</label><input id="email" type="email" th:field="*{email}" autocomplete="email" placeholder="nombre@correo.com" required><small class="recovery-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small><button type="submit">Enviar código temporal</button></form><p class="recovery-footer">Por seguridad no confirmamos si una cuenta existe.<br><a th:href="@{/login}">← Volver a iniciar sesión</a></p></main></body>
</html>
