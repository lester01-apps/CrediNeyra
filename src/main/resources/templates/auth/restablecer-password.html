<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña | crediNeyra</title><link rel="stylesheet" th:href="@{/css/auth-recuperacion.css}"></head>
<body class="auth-recovery"><main class="recovery-card"><p class="recovery-brand">credi<span>Neyra</span></p><p class="recovery-eyebrow">CÓDIGO TEMPORAL</p><h1>Define tu nueva contraseña</h1><p class="recovery-description">Ingresa el código que enviamos a tu correo. Es válido por 15 minutos y se utiliza una sola vez.</p><p class="recovery-message success" th:if="${mensaje != null}" th:text="${mensaje}"></p><p class="recovery-message error" th:if="${mensajeError != null}" th:text="${mensajeError}"></p><form class="recovery-form" method="post" th:action="@{/recuperar-password/codigo}" th:object="${restablecerDto}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="token">Código temporal</label><input id="token" type="text" th:field="*{token}" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="Ej.: A1B2C3D4E5F6" required><small class="recovery-error" th:if="${#fields.hasErrors('token')}" th:errors="*{token}"></small><label for="password">Nueva contraseña</label><div class="password-control"><input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="password" aria-label="Mostrar contraseña">Ver</button></div><small class="recovery-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small><label for="confirmarPassword">Confirmar contraseña</label><div class="password-control"><input id="confirmarPassword" type="password" th:field="*{confirmarPassword}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="confirmarPassword" aria-label="Mostrar contraseña">Ver</button></div><small class="recovery-error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></small><button type="submit">Guardar mi nueva contraseña</button></form><p class="recovery-footer"><a th:href="@{/recuperar-password}">Solicitar un código nuevo</a><br><a th:href="@{/login}">← Cancelar y volver a iniciar sesión</a></p></main><script th:src="@{/js/auth-password.js}"></script></body>
</html>
