<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Detalle de usuario · crediNeyra</title><link rel="stylesheet" th:href="@{/css/admin/dashboard.css}"><link rel="stylesheet" th:href="@{/css/admin/usuarios.css}"></head>
<body><div class="admin-layout"><aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside><div th:replace="~{admin/fragments/sidebar :: sidebar-overlay}"></div><main class="admin-main"><header th:replace="~{admin/fragments/topbar :: topbar}"></header><section class="usuarios-contenido formulario-contenido"><a class="volver" th:href="@{/admin/usuarios}">← Volver a usuarios</a><article class="detalle-usuario"><p class="eyebrow">CUENTA DE USUARIO</p><h1 th:text="${usuario.username}">usuario</h1><dl><div><dt>Estado</dt><dd th:text="${usuario.estado}">ACTIVA</dd></div><div><dt>Primer ingreso</dt><dd th:text="${usuario.cambioPasswordObligatorio ? 'Pendiente de confirmación' : 'Confirmado'}">-</dd></div><div><dt>Último acceso</dt><dd th:text="${usuario.ultimoAcceso == null ? 'Sin accesos registrados' : #temporals.format(usuario.ultimoAcceso, 'dd/MM/yyyy HH:mm')}">-</dd></div><div><dt>Roles</dt><dd><span th:each="rolUsuario, iter : ${rolesUsuario}" th:text="${rolUsuario.rol.nombre + (iter.last ? '' : ', ')}">ROL</span></dd></div></dl></article></section></main></div><script th:src="@{/js/admin/dashboard.js}"></script></body>
</html>
