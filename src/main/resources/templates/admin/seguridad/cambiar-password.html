<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | crediNeyra</title>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin/perfil.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .admin-password-page{background:radial-gradient(circle at 72% 0,#097fc536,transparent 36%),#031326;min-height:calc(100vh - 70px);padding:28px}.password-back{color:#5cd8ff;font-size:13px;text-decoration:none}.admin-password-card{background:linear-gradient(145deg,#07335aed,#041e3bf5);border:1px solid #1689c9;border-radius:13px;box-shadow:0 14px 35px #0008;margin:18px auto;max-width:520px;padding:28px}.password-icon{align-items:center;background:linear-gradient(135deg,#6324c4,#087be8);border-radius:12px;color:#fff;display:flex;font-size:26px;height:54px;justify-content:center;width:54px}.password-label{color:#36d7ff;font-size:10px;font-weight:800;letter-spacing:1px;margin:16px 0 6px}.admin-password-card h1{font-size:25px;margin:0}.password-description{color:#b8cee5;font-size:13px;line-height:1.55;margin:8px 0 18px}.admin-password-form{display:grid;gap:7px}.admin-password-form label{color:#d6e8fc;font-size:12px;font-weight:700;margin-top:5px}.admin-password-form input{background:#03182f;border:0;color:#f5fbff;min-height:42px;padding:0 12px;width:100%}.password-control{align-items:center;background:#03182f;border:1px solid #176897;border-radius:7px;display:flex}.password-control:focus-within{border-color:#28cbff;outline:2px solid #22bdfa35}.password-control button{background:#0c345a;border:0;border-radius:6px;color:#59d9ff;cursor:pointer;font-size:11px;font-weight:800;margin:4px;min-height:34px;padding:0 10px}.admin-password-form>button{background:linear-gradient(100deg,#09a5ed,#154dde);border:0;border-radius:7px;color:#fff;cursor:pointer;font-weight:800;margin-top:12px;min-height:45px}.password-field-error{color:#ff8aa0;font-size:11px}.password-message{border-radius:7px;font-size:12px;margin:10px 0;padding:10px 12px}.password-message.success{background:#07563f;color:#a9ffdc}.password-message.error{background:#692038;color:#ffc4cf}.password-resend{margin-top:14px;text-align:center}.password-resend button{background:transparent;border:0;color:#55d5ff;cursor:pointer;font-size:12px;font-weight:700}.password-note{color:#92b2d1;font-size:11px;text-align:center}.password-note i{color:#4bd9ff;margin-right:5px}@media(max-width:700px){.admin-password-page{padding:16px}.admin-password-card{padding:20px}}
    </style>
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{admin/fragments/sidebar :: sidebar-overlay}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar}"></div>
        <main class="admin-password-page">
            <a class="password-back" th:href="@{/admin/perfil}"><i class="fa-solid fa-arrow-left"></i> Volver a mi perfil</a>
            <section class="admin-password-card">
                <div class="password-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <p class="password-label">VERIFICACIÓN POR CORREO</p>
                <h1>Cambiar contraseña</h1>
                <p class="password-description">Ingresa el código temporal enviado a tu correo registrado y define una nueva contraseña para tu cuenta administrativa.</p>
                <div class="password-message success" th:if="${mensajeExito != null}" th:text="${mensajeExito}"></div>
                <div class="password-message error" th:if="${mensajeError != null}" th:text="${mensajeError}"></div>
                <form method="post" th:action="@{/admin/seguridad/cambiar-password}" th:object="${restablecerDto}" class="admin-password-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label for="token">Código temporal</label>
                    <input id="token" type="text" th:field="*{token}" autocomplete="one-time-code" placeholder="Ej.: A1B2C3D4E5F6" required>
                    <small class="password-field-error" th:if="${#fields.hasErrors('token')}" th:errors="*{token}"></small>
                    <label for="password">Nueva contraseña</label>
                    <div class="password-control"><input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="password" aria-label="Mostrar contraseña">Ver</button></div>
                    <small class="password-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                    <label for="confirmarPassword">Confirma la contraseña</label>
                    <div class="password-control"><input id="confirmarPassword" type="password" th:field="*{confirmarPassword}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="confirmarPassword" aria-label="Mostrar contraseña">Ver</button></div>
                    <small class="password-field-error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></small>
                    <button type="submit"><i class="fa-solid fa-lock"></i> Guardar nueva contraseña</button>
                </form>
                <form method="post" th:action="@{/admin/seguridad/cambiar-password}" class="password-resend">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="reenviar" value="true">
                    <button type="submit">Reenviar código</button>
                </form>
                <p class="password-note"><i class="fa-regular fa-clock"></i> El código vence en 15 minutos y solo puede utilizarse una vez.</p>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/admin/dashboard.js}"></script><script th:src="@{/js/auth-password.js}"></script>
</body>
</html>
