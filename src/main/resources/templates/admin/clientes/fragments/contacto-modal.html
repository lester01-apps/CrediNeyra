<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>


<div th:fragment="contacto-modal"
     class="contacto-modal-fondo"
     id="contactoModal">


    <section class="contacto-panel">


        <!-- =============================================
             CERRAR
             ============================================= -->

        <button type="button"
                class="contacto-cerrar"
                id="contactoCerrar"
                aria-label="Cerrar">

            <svg viewBox="0 0 24 24">

                <path d="M6 6l12 12">
                </path>

                <path d="M18 6 6 18">
                </path>

            </svg>

        </button>



        <!-- =============================================
             CABECERA
             ============================================= -->

        <header class="contacto-header">


            <div class="contacto-header-icono">

                <svg viewBox="0 0 24 24">

                    <path d="M22 2 11 13">
                    </path>

                    <path d="m22 2-7 20-4-9-9-4Z">
                    </path>

                </svg>

            </div>


            <div>

                <span class="contacto-mini-titulo">
                    COMUNICACIÓN
                </span>

                <h2>
                    Contactar cliente
                </h2>

                <p>
                    Prepara un mensaje personalizado y selecciona
                    el canal de comunicación.
                </p>

            </div>


        </header>



        <!-- =============================================
             CUERPO
             ============================================= -->

        <div class="contacto-layout">


            <!-- =========================================
                 COLUMNA IZQUIERDA
                 ========================================= -->

            <aside class="contacto-cliente-card">


                <div class="contacto-avatar"
                     id="contactoAvatar">

                    C

                </div>


                <h3 id="contactoClienteNombre">
                    Cliente
                </h3>


                <span class="contacto-codigo"
                      id="contactoClienteCodigo">

                    CLI-00000

                </span>



                <div class="contacto-separador">
                </div>



                <div class="contacto-dato">


                    <span>
                        DNI
                    </span>


                    <strong id="contactoClienteDni">
                        -
                    </strong>


                </div>



                <div class="contacto-dato">


                    <span>
                        Teléfono
                    </span>


                    <strong id="contactoClienteTelefono">
                        -
                    </strong>


                </div>



                <div class="contacto-dato">


                    <span>
                        Correo
                    </span>


                    <strong id="contactoClienteEmail">
                        -
                    </strong>


                </div>



                <div class="contacto-separador">
                </div>



                <div class="contacto-cuota-resumen">


                    <span>
                        Próxima cuota pendiente
                    </span>


                    <strong id="contactoMonto">
                        S/ 0.00
                    </strong>


                    <small id="contactoFecha">
                        Sin fecha
                    </small>


                </div>



                <span class="contacto-situacion"
                      id="contactoSituacion">

                    SIN CRÉDITO

                </span>


            </aside>



            <!-- =========================================
                 COLUMNA DERECHA
                 ========================================= -->

            <div class="contacto-editor">


                <!-- CANAL -->

                <div class="contacto-bloque">


                    <label class="contacto-label">
                        Canal de comunicación
                    </label>


                    <div class="contacto-canales">


                        <button type="button"
                                class="contacto-canal activo"
                                id="canalWhatsApp">

                            <span class="contacto-canal-icono whatsapp">

                                <svg viewBox="0 0 24 24">

                                    <path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5Z">
                                    </path>

                                    <path d="M8.5 8.5c1 3 3 5 6 6">
                                    </path>

                                </svg>

                            </span>


                            <span>

                                <strong>
                                    WhatsApp
                                </strong>

                                <small>
                                    Abrir conversación
                                </small>

                            </span>


                        </button>



                        <button type="button"
                                class="contacto-canal"
                                id="canalCorreo">

                            <span class="contacto-canal-icono correo">

                                <svg viewBox="0 0 24 24">

                                    <rect x="3"
                                          y="5"
                                          width="18"
                                          height="14"
                                          rx="2">
                                    </rect>

                                    <path d="m4 7 8 6 8-6">
                                    </path>

                                </svg>

                            </span>


                            <span>

                                <strong>
                                    Correo
                                </strong>

                                <small>
                                    Enviar desde crediNeyra
                                </small>

                            </span>


                        </button>


                    </div>


                </div>



                <!-- FORMULARIO -->

                <form method="post"
                      id="formContactoCorreo">


                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">


                    <input type="hidden"
                           name="volver"
                           id="contactoVolver"
                           value="lista">



                    <!-- ASUNTO -->

                    <div class="contacto-campo"
                         id="grupoAsunto">


                        <label for="contactoAsunto">

                            Asunto

                            <span>*</span>

                        </label>


                        <input type="text"
                               name="asunto"
                               id="contactoAsunto"
                               maxlength="160"
                               placeholder="Asunto del correo...">


                    </div>



                    <!-- MENSAJE -->

                    <div class="contacto-campo">


                        <div class="contacto-label-linea">

                            <label for="contactoMensaje">

                                Mensaje

                                <span>*</span>

                            </label>


                            <button type="button"
                                    id="regenerarMensaje"
                                    class="btn-regenerar">

                                Regenerar mensaje

                            </button>

                        </div>


                        <textarea name="mensaje"
                                  id="contactoMensaje"
                                  maxlength="4000"
                                  rows="15">
                        </textarea>


                        <div class="contacto-textarea-footer">

                            <span>
                                Puedes editar el mensaje antes de enviarlo.
                            </span>

                            <span id="contadorContacto">
                                0 / 4000
                            </span>

                        </div>


                    </div>



                    <!-- ACCIONES -->

                    <footer class="contacto-acciones">


                        <button type="button"
                                class="btn-contacto-secundario"
                                id="copiarMensajeContacto">

                            <svg viewBox="0 0 24 24">

                                <rect x="8"
                                      y="8"
                                      width="11"
                                      height="11"
                                      rx="2">
                                </rect>

                                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3">
                                </path>

                            </svg>

                            Copiar mensaje

                        </button>



                        <button type="button"
                                class="btn-contacto-cancelar"
                                id="cancelarContacto">

                            Cancelar

                        </button>



                        <button type="button"
                                class="btn-contacto-principal whatsapp"
                                id="accionWhatsApp">

                            <svg viewBox="0 0 24 24">

                                <path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5Z">
                                </path>

                                <path d="M8.5 8.5c1 3 3 5 6 6">
                                </path>

                            </svg>

                            Abrir WhatsApp

                        </button>



                        <button type="submit"
                                class="btn-contacto-principal correo"
                                id="accionCorreo"
                                hidden>

                            <svg viewBox="0 0 24 24">

                                <rect x="3"
                                      y="5"
                                      width="18"
                                      height="14"
                                      rx="2">
                                </rect>

                                <path d="m4 7 8 6 8-6">
                                </path>

                            </svg>

                            Enviar correo

                        </button>


                    </footer>


                </form>


            </div>


        </div>


    </section>


</div>


<!-- TOAST CONTACTO -->

<div th:fragment="contacto-toast"
     id="contactoToast"
     class="contacto-toast">

    <span id="contactoToastTexto">
        Acción realizada.
    </span>

</div>


</body>
</html>
