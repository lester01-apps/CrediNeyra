<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="topbar"
        class="topbar">

    <div class="topbar-izquierda">

        <button type="button"
                class="boton-menu"
                id="botonMenu"
                aria-label="Abrir menú">

            <span></span>
            <span></span>
            <span></span>

        </button>


        <div class="buscador">

            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6"/>
                <path d="m16 16 4 4"/>
            </svg>

            <input type="search"
                   placeholder="Buscar clientes, créditos o pagos..."
                   id="busquedaGeneral">

        </div>

    </div>


    <div class="topbar-derecha">

        <details class="menu-notificaciones">
            <summary class="boton-notificaciones" aria-label="Abrir notificaciones">
                <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
                <span class="notificacion-punto"></span>
            </summary>
            <div class="panel-notificaciones-admin">
                <header><b>Notificaciones</b><a th:href="@{/admin/auditoria}">Ver más</a></header>
                <p><i class="fa-solid fa-shield-halved"></i> Las acciones del sistema se registran en Auditoría.</p>
                <a class="ver-todas-notificaciones" th:href="@{/admin/auditoria}"><i class="fa-regular fa-clock"></i> Ver más notificaciones <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </details>


        <a class="usuario-topbar" th:href="@{/admin/perfil}" aria-label="Abrir mi perfil">

            <div class="usuario-avatar">
                <img th:if="${administradorTieneFotoPerfil}" th:src="@{/admin/perfil/foto}" alt="Foto de perfil">
                <span th:unless="${administradorTieneFotoPerfil}" th:text="${administradorInicial != null ? administradorInicial : 'AD'}">AD</span>
            </div>

            <div class="usuario-datos">

                <strong th:text="${username}">
                    Administrador
                </strong>

                <span>
                    Administrador
                </span>

            </div>

        </a>

    </div>

</header>

</body>
</html>
