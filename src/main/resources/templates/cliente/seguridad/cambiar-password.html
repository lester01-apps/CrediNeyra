<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | crediNeyra</title>
    <link rel="stylesheet" th:href="@{/css/cliente/seguridad.css}">
</head>
<body>
<main class="seguridad-contenedor">
    <section class="tarjeta-seguridad">
        <p class="marca">credi<span>Neyra</span></p>
        <p class="etiqueta">VERIFICACIÓN POR CORREO</p>
        <h1>Crea tu contraseña</h1>
        <p class="descripcion">Ingresa el código temporal que enviamos a tu correo registrado y define una contraseña que solo tú conozcas.</p>

        <div class="mensaje exito" th:if="${mensajeExito != null}" th:text="${mensajeExito}"></div>
        <div class="mensaje error" th:if="${mensajeError != null}" th:text="${mensajeError}"></div>

        <form method="post" th:action="@{/cliente/seguridad/cambiar-password}" th:object="${restablecerDto}" class="formulario-seguridad">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="token">Código temporal</label>
            <input id="token" type="text" th:field="*{token}" autocomplete="one-time-code" placeholder="Ej.: A1B2C3D4E5F6" required>
            <small class="campo-error" th:if="${#fields.hasErrors('token')}" th:errors="*{token}"></small>

            <label for="password">Nueva contraseña</label>
            <span class="password-control"><input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="password" aria-label="Mostrar contraseña">Ver</button></span>
            <small class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

            <label for="confirmarPassword">Confirma la contraseña</label>
            <span class="password-control"><input id="confirmarPassword" type="password" th:field="*{confirmarPassword}" autocomplete="new-password" minlength="8" required><button type="button" data-password-toggle="confirmarPassword" aria-label="Mostrar contraseña">Ver</button></span>
            <small class="campo-error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></small>

            <button class="boton primario" type="submit">Guardar mi nueva contraseña</button>
        </form>

        <form method="post" th:action="@{/cliente/seguridad/cambiar-password}" class="reenviar">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="reenviar" value="true">
            <button type="submit">Reenviar código</button>
        </form>
        <p class="pie">El código vence en 15 minutos y puede utilizarse una sola vez.</p>
        <form method="post" th:action="@{/logout}" class="salir-seguridad"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Salir sin cambiar la contraseña</button></form>
    </section>
</main>
<script th:src="@{/js/auth-password.js}"></script>
</body>
</html>
