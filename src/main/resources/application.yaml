spring:
  application:
    name: crediNeyra

  datasource:
    url: jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?user=postgres.wzwqdfgzmnrlosweqcvo&sslmode=require
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    open-in-view: false

  # Ejecuta migraciones SQL idempotentes antes de validar entidades JPA.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # =========================================================
  # CORREO GMAIL
  # =========================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # =========================================================
  # SUBIDA DE ARCHIVOS
  # CONTRATOS / GARANTIAS
  # =========================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB


server:
  port: 8087


credineyra:

  # =========================================================
  # APLICACION
  # =========================================================
  app:
    base-url: http://localhost:8087

  # Datos visibles para el flujo de pago del cliente.
  # Los enlaces apuntan a los canales reales ya publicados en Contáctanos.
  pagos:
    yape:
      numero: ${CREDINEYRA_YAPE_NUMERO:973860581}
      titular: ${CREDINEYRA_YAPE_TITULAR:Fransisco Neyra Mijahuanga}
      qr-url: ${CREDINEYRA_YAPE_QR_URL:}
    efectivo:
      mapa-url: ${CREDINEYRA_MAPA_URL:https://maps.app.goo.gl/Nukh3SaFxVjLiC5DA}


  # =========================================================
  # REGLAS DE MORA
  # =========================================================
  mora:
    dias-gracia: 3
    meses-atraso-prolongado: 4


  # =========================================================
  # WHATSAPP BUSINESS (recordatorios automáticos)
  #
  # La plantilla de Meta debe estar aprobada y aceptar cinco
  # parámetros: nombre, cuota, crédito, monto y vencimiento.
  # Mantener las credenciales como variables de entorno.
  # =========================================================
  whatsapp:
    admin-numero: ${CREDINEYRA_WHATSAPP_NUMERO:51973860581}
    enabled: ${WHATSAPP_ENABLED:false}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    reminder-template: ${WHATSAPP_REMINDER_TEMPLATE:recordatorio_cuota}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es_PE}
    country-code: ${WHATSAPP_COUNTRY_CODE:51}


  # =========================================================
  # SUPABASE STORAGE
  # =========================================================
  supabase:
    url: ${SUPABASE_URL:https://wzwqdfgzmnrlosweqcvo.supabase.co}

    # NO colocar la clave directamente aquí.
    # Se configurará en IntelliJ como variable de entorno.
    service-key: ${SUPABASE_SECRET_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    # Bucket PRIVADO donde guardaremos contratos y garantías.
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:documentos-privados}


  # =========================================================
  # DATOS DEL PRESTAMISTA
  # APARECERAN EN EL CONTRATO PDF
  # =========================================================
  prestamista:
    nombre: ${CREDINEYRA_PRESTAMISTA_NOMBRE:}
    documento: ${CREDINEYRA_PRESTAMISTA_DOCUMENTO:}
    domicilio: ${CREDINEYRA_PRESTAMISTA_DOMICILIO:}
